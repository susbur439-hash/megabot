name: Megabot Control Panel

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Введите задачу для Megabot"
        required: true
        default: "развивай себя"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install -r requirements.txt || true

      - name: Запуск Megabot
        run: python main.py "${{ github.event.inputs.task }}"
