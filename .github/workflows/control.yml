name: Megabot Control Panel

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Введите задачу для Megabot"
        required: true
        default: "развивай себя"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v3

      # 🔥 СКАЧИВАЕМ ПАМЯТЬ
      - name: 📥 Загрузка памяти
        uses: actions/download-artifact@v4
        with:
          name: system-snapshot
          path: downloaded
        continue-on-error: true

      # 🔥 ПЕРЕМЕЩАЕМ В КОРЕНЬ
      - name: 🔧 Восстановление памяти
        run: |
          if [ -f downloaded/memory.json ]; then
            mv downloaded/memory.json ./memory.json
          fi

          if [ -d downloaded/modules ]; then
            cp -r downloaded/modules/* modules/ || true
          fi

      - name: 🐍 Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Установка зависимостей
        run: pip install -r requirements.txt || true

      - name: 🤖 Запуск Megabot
        run: python main.py "${{ github.event.inputs.task }}"

      # 🔥 SNAPSHOT
      - name: 📸 Создание snapshot системы
        run: python system_snapshot.py || echo "No snapshot script"

      # 🔥 СОХРАНЕНИЕ
      - name: 📤 Сохранение snapshot
        uses: actions/upload-artifact@v4
        with:
          name: system-snapshot
          path: |
            memory.json
            full_system_snapshot.txt
            modules/
