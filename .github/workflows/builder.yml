name: Megabot Builder

on:
workflow_dispatch:

Принудительно переводим все процессы на Node.js 24

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
build:
runs-on: ubuntu-latest

steps:
  # Поддержка Node.js 24
  - name: Checkout
    uses: actions/checkout@v6

  # Python 3.11
  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.11"

  # Запуск Builder с передачей токена моделей
  - name: Run Builder
    env:
      MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
    run: python megabot_controlled_builder.py