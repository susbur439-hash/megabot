name: Megabot Builder

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Builder
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: python megabot_controlled_builder.py