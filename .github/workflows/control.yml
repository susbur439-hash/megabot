name: Megabot Control Panel

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Введите задачу для Megabot"
        required: true
        default: '{"task": "развивай себя"}'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      # 🔥 СКАЧИВАЕМ ПАМЯТЬ
      - name: 📥 Загрузка памяти
        uses: actions/download-artifact@v4
        with:
          name: system-snapshot
          path: downloaded
        continue-on-error: true

      # 🔥 ВОССТАНОВЛЕНИЕ
      - name: 🔧 Восстановление памяти
        run: |
          if [ -f downloaded/memory.json ]; then
            mv downloaded/memory.json ./memory.json
          fi

          if [ -d downloaded/modules ]; then
            mkdir -p modules
            cp -r downloaded/modules/* modules/ || true
          fi

      - name: 🐍 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Установка зависимостей
        run: pip install -r requirements.txt || true

      # =========================
      # 🤖 ЗАПУСК МЕГАБОТА (FIXED)
      # =========================
      - name: 🤖 Запуск Megabot
        env:
          TASK_JSON: '${{ github.event.inputs.task }}'
        run: |
          echo "📨 TASK_JSON = $TASK_JSON"
          python main.py

      # =========================
      # 👁 OBLIVION
      # =========================
      - name: 👁 Oblivion Check
        run: |
          python - <<EOF
          from modules.system_observer import run
          import json

          try:
              with open("memory.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except:
              data = {}

          result = run(data)

          issues = result.get("system_map", {}).get("architecture_issues", [])
          broken = result.get("system_map", {}).get("broken_links", [])
          errors = result.get("system_map", {}).get("errors", [])

          if issues or broken or errors:
              print("🚨 OBLIVION FOUND PROBLEMS")
              print("Architecture:", len(issues))
              print("Broken links:", len(broken))
              print("Errors:", len(errors))
              exit(1)
          else:
              print("✅ OBLIVION OK")
          EOF

      # =========================
      # 📸 SNAPSHOT
      # =========================
      - name: 📸 Создание snapshot системы
        run: python system_snapshot.py || echo "No snapshot script"

      # =========================
      # 📤 СОХРАНЕНИЕ
      # =========================
      - name: 📤 Сохранение snapshot
        uses: actions/upload-artifact@v4
        with:
          name: system-snapshot
          path: |
            memory.json
            full_system_snapshot.txt
            modules/
